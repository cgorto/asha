[package]
name = "render"
version.workspace = true
edition.workspace = true

[dev-dependencies]
abi-core.workspace = true
# Keep Bevy UI widgets render-free.
bevy_ui_widgets = { version = "=0.19.0", default-features = false }
app = { path = "../app" }
# Used only by examples and headless pass tests.
post = { path = "../post" }
# Enables PNG dumps for examples and tests.
gpu = { workspace = true, features = ["dump"] }
png = "0.17"
# Self-dev-dependency enables this crate's gated gltf tests.
render = { path = ".", features = ["gltf"] }

[lints]
workspace = true

[features]
# GPU and render-thread Tracy zones.
tracy = ["dep:tracy-client"]
# glTF parsing without wgpu or naga.
gltf = ["dep:gltf"]

[dependencies]
abi-mesh = { workspace = true, features = ["bevy"] }
abi-light.workspace = true
abi-bake.workspace = true
abi-core.workspace = true
asha-assets.workspace = true
# Pin to bevy_log's tracing-tracy bridge.
tracy-client = { version = "0.18.3", optional = true }
gpu.workspace = true
mesh = { path = "../mesh" }
# Post is used only by examples and headless tests.
bevy = { workspace = true }
bytemuck = { workspace = true }
gltf = { version = "1.4.1", default-features = false, features = ["import", "names", "utils"], optional = true }
