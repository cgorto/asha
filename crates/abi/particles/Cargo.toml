[package]
name = "abi-particles"
version.workspace = true
edition.workspace = true

[features]
# Bevy component derives remain host-only through target gating.
bevy = ["dep:bevy_ecs"]

[dependencies]
abi-core = { path = "../core" }

[target.'cfg(target_arch = "spirv")'.dependencies]
glam = { version = "=0.32.1", default-features = false, features = ["libm"] }
spirv-std = { git = "https://github.com/cgorto/rust-gpu", rev = "a13e7386da8a3b3b71e2fc7a5e3f91ecf7a88f7b" }

[target.'cfg(not(target_arch = "spirv"))'.dependencies]
glam = { version = "=0.32.1", default-features = false, features = ["bytemuck", "libm"] }
bytemuck = { version = "1", features = ["derive"] }
bevy_ecs = { version = "=0.19.0", optional = true }

[lints]
workspace = true
