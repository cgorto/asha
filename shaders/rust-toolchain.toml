# Must match the pinned fork's toolchain exactly (the codegen backend links
# against rustc internals). Keep in lockstep with the rev pinned in
# ./Cargo.toml — check rust-toolchain.toml at that rev when bumping.
[toolchain]
channel = "nightly-2026-04-11"
components = ["rust-src", "rustc-dev", "llvm-tools"]
